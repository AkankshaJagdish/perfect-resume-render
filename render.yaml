services:
  - type: web
    name: perfectresume-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.24.0 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      cd app &&
      ./scripts/install-tectonic.sh &&
      wasp install &&
      wasp build &&
      node scripts/copy-resume-template.mjs &&
      cd .wasp/out/server &&
      npm install &&
      npx prisma generate --schema=../db/schema.prisma &&
      npm run bundle
    startCommand: export PATH="$PWD/app/bin:$PATH" && cd app/.wasp/out/server && npm run start-production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: perfectresume-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WASP_SERVER_URL
        fromService:
          type: web
          name: perfectresume-server
          envVarKey: RENDER_EXTERNAL_URL
      - key: WASP_WEB_CLIENT_URL
        fromService:
          type: web
          name: perfectresume-client
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: live_mode
      - key: PAYMENTS_STARTER_SUBSCRIPTION_PLAN_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_S3_IAM_ACCESS_KEY
        sync: false
      - key: AWS_S3_IAM_SECRET_KEY
        sync: false
      - key: AWS_S3_FILES_BUCKET
        sync: false
      - key: AWS_S3_REGION
        sync: false
      - key: PLAUSIBLE_API_KEY
        sync: false
      - key: PLAUSIBLE_SITE_ID
        sync: false
      - key: PLAUSIBLE_BASE_URL
        value: https://plausible.io/api
      - key: NODE_VERSION
        value: "24"
      - key: WASP_TELEMETRY_CONTEXT
        value: render-perfectresume

  - type: web
    name: perfectresume-client
    runtime: static
    branch: main
    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.24.0 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      cd app &&
      wasp install &&
      wasp build &&
      npx vite build
    staticPublishPath: app/.wasp/out/web-app/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: perfectresume-server
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_GOOGLE_ANALYTICS_ID
        sync: false
      - key: NODE_VERSION
        value: "24"
      - key: WASP_TELEMETRY_CONTEXT
        value: render-perfectresume
    routes:
      - type: rewrite
        source: /*
        destination: /200.html

databases:
  - name: perfectresume-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
